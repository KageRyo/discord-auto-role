name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}

      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.13.5"

      # Install only the locked, hash-verified dependency wheels. The project
      # itself is not built; tests import it from src/ via PYTHONPATH.
      - name: Install locked dependencies
        run: uv sync --locked --no-build --no-install-project

      - name: Compile check
        run: uv run --no-sync --no-build python -m compileall -q src tests

      - name: Run unit tests
        run: uv run --no-sync --no-build python -m unittest discover -s tests -v
        env:
          PYTHONPATH: src
